name: macOS Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Resources/Info.plist)
          test "$RELEASE_TAG" = "v$VERSION"
          test -f "macos/Releases/$RELEASE_TAG.md"
      - run: swift run --package-path macos TranscribatorCoreChecks
      - run: macos/Scripts/check-gpt-app-session.sh
      - run: macos/Scripts/check-status-ui.sh
      - name: Build and verify Universal distribution
        run: |
          macos/Scripts/package-distribution.sh
          cd macos/dist
          shasum -a 256 -c SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" macos/dist/*.zip macos/dist/*.dmg macos/dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              macos/dist/*.zip macos/dist/*.dmg macos/dist/SHA256SUMS \
              --verify-tag --prerelease \
              --title "Transcribator ${RELEASE_TAG#v}" \
              --notes-file "macos/Releases/$RELEASE_TAG.md"
          fi
